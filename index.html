
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İnşaat Stok & Kullanım Takip</title>
    <!-- PDF Oluşturma Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f0f2f5; color: #1c1e21; padding: 16px; padding-bottom: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* En Üst Kritik Stok Kırmızı Banner */
        .alert-banner { 
            background: #dc2626; 
            color: white; 
            padding: 14px 18px; 
            border-radius: 12px; 
            margin-bottom: 16px; 
            font-weight: bold; 
            font-size: 14px; 
            display: none; 
            flex-direction: column;
            gap: 4px; 
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); 
        }
        
        .header { background: #1e293b; color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; text-align: center; }
        .stats { display: flex; gap: 12px; margin-top: 12px; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; flex: 1; }
        .stat-card span { font-size: 20px; font-weight: bold; display: block; }
        
        .card { background: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #334155; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus, select:focus { border-color: #2563eb; }
        
        .btn { padding: 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100%; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-pdf { background: #059669; color: white; margin-bottom: 16px; font-size: 15px; }
        .btn-use { background: #16a34a; color: white; flex: 2; font-size: 15px; }
        .btn-add { background: #0284c7; color: white; flex: 1; font-size: 15px; }
        .btn-delete { background: #fee2e2; color: #dc2626; flex: 0.8; font-size: 15px; }
        .btn-cancel { background: #64748b; color: white; }
        .btn-clear-logs { background: #fee2e2; color: #dc2626; padding: 6px 12px; font-size: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        
        /* Arama Kutusu & Filtreler */
        .search-box { margin-bottom: 12px; }
        .filter-container { display: flex; gap: 8px; margin-bottom: 16px; }
        .filter-btn { flex: 1; padding: 10px; border: 1px solid #cbd5e1; background: white; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .filter-btn.active { background: #0f172a; color: white; border-color: #0f172a; }
        
        .item-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 25px; }
        .item-card { background: white; padding: 16px; border-radius: 16px; border-left: 6px solid #2563eb; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .item-card.critical { border-left-color: #dc2626; background: #fff5f5; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .item-title { font-size: 17px; font-weight: bold; color: #0f172a; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-kose { background: #fef3c7; color: #d97706; }
        .badge-duz { background: #e0f2fe; color: #0369a1; }
        .badge-critical { background: #fee2e2; color: #dc2626; margin-left: 6px; }
        .item-body { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-weight: bold; }
        .item-actions { display: flex; gap: 8px; }
        
        /* Geçmiş Kayıtları */
        .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8fafc; border-radius: 8px; font-size: 13px; border-left: 3px solid #16a34a; }
        .history-info { flex: 1; }
        .history-date { color: #64748b; font-size: 11px; margin-top: 2px; }
        .btn-log-delete { background: none; border: none; color: #dc2626; font-size: 16px; cursor: pointer; padding: 4px; }

        /* Modal Onay Kutusu */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal { background: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 350px; text-align: center; }
        .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }

        /* PDF Basım Esnasında Gizlenecek Elemanlar */
        .no-print { display: block; }
        .pdf-mode .no-print, 
        .pdf-mode .item-actions, 
        .pdf-mode .btn-log-delete, 
        .pdf-mode .btn-clear-logs,
        .pdf-mode .search-box,
        .pdf-mode .filter-container { display: none !important; }
    </style>
</head>
<body>

<div class="container" id="pdf-content">
    
    <!-- En Üst Kritik Stok Kırmızı Uyarı Sekmesi -->
    <div class="alert-banner" id="critical-alert">
        <div>⚠️ KRİTİK STOK UYARISI (1 veya 0 Adet):</div>
        <div id="critical-items-text" style="font-weight: normal; font-size: 13px;"></div>
    </div>

    <div class="header">
        <h2>🏗️ İnşaat Stok & Panel Takip</h2>
        <div class="stats">
            <div class="stat-card"><small>Çeşit Sayısı</small><span id="total-items">0</span></div>
            <div class="stat-card"><small>Toplam Stok</small><span id="total-quantity">0</span></div>
        </div>
    </div>

    <button class="btn btn-pdf no-print" onclick="generatePDF()">📄 PDF Raporu Oluştur & İndir</button>

    <div class="card no-print">
        <h3>➕ Yeni Malzeme / Panel Ekle</h3>
        <br>
        <div class="form-group">
            <label>Malzeme / Panel Adı</label>
            <input type="text" id="item-name" placeholder="Örn: 90° Köşe Paneli">
        </div>
        <div class="form-group">
            <label>Mevcut Adet</label>
            <input type="number" id="item-qty" placeholder="Örn: 50" min="0">
        </div>
        <div class="form-group">
            <label>Kategori</label>
            <select id="item-category">
                <option value="Köşe">Köşe</option>
                <option value="Düz">Düz</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="addItem()">Stoka Ekle</button>
    </div>

    <!-- Hızlı Arama Çubuğu -->
    <div class="search-box no-print">
        <input type="text" id="search-input" placeholder="🔍 Malzeme adı ile hızlı ara..." oninput="renderList()">
    </div>

    <!-- Kategori Filtreleri -->
    <div class="filter-container no-print">
        <button class="filter-btn active" onclick="filterItems('Hepsi', this)">Tümü</button>
        <button class="filter-btn" onclick="filterItems('Köşe', this)">Köşe</button>
        <button class="filter-btn" onclick="filterItems('Düz', this)">Düz</button>
    </div>

    <!-- Stok Listesi -->
    <div class="item-list" id="item-list"></div>

    <!-- Kullanım Geçmişi -->
    <div class="card">
        <div class="card-header-flex">
            <h3>📋 Kullanım Geçmişi</h3>
            <button class="btn-clear-logs no-print" onclick="requestAction('clear_logs')">Tümünü Temizle</button>
        </div>
        <div class="history-list" id="history-list"></div>
    </div>
</div>

<!-- Modal Onay Kutusu -->
<div class="modal-overlay" id="confirm-modal">
    <div class="modal">
        <h3 id="modal-title">İşlem Onayı</h3>
        <p id="modal-msg" style="margin-top:8px; color:#475569; font-size:14px;"></p>
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeModal()">İptal</button>
            <button class="btn btn-primary" id="modal-confirm-btn">Evet, Onayla</button>
        </div>
    </div>
</div>

<script>
    // Başlangıç Verileri
    let items = JSON.parse(localStorage.getItem('insaat_stok_v4')) || [
        { id: 1, name: 'Köşe Paneli 90°', quantity: 1, category: 'Köşe' },
        { id: 2, name: 'Düz Duvar Paneli 50cm', quantity: 120, category: 'Düz' }
    ];
    let usageLogs = JSON.parse(localStorage.getItem('insaat_logs_v4')) || [];
    let currentFilter = 'Hepsi';

    // Verileri Kaydet ve Ekranı Güncelle
    function saveAndRender() {
        localStorage.setItem('insaat_stok_v4', JSON.stringify(items));
        localStorage.setItem('insaat_logs_v4', JSON.stringify(usageLogs));
        renderList();
        renderLogs();
        checkCriticalStock();
    }

    // Kritik Stok Kontrolü (1 veya 0 Adet)
    function checkCriticalStock() {
        const criticalItems = items.filter(item => item.quantity <= 1);
        const alertBox = document.getElementById('critical-alert');
        const alertText = document.getElementById('critical-items-text');

        if(criticalItems.length > 0) {
            const names = criticalItems.map(i => `• ${i.name} (Kalan: ${i.quantity} Adet)`).join('<br>');
            alertText.innerHTML = names;
            alertBox.style.display = 'flex';
        } else {
            alertBox.style.display = 'none';
        }
    }

    // Malzeme Listesini Ekrana Çiz
    function renderList() {
        const listEl = document.getElementById('item-list');
        const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
        listEl.innerHTML = '';
        
        let filteredItems = items.filter(item => {
            const matchesCategory = (currentFilter === 'Hepsi' || item.category === currentFilter);
            const matchesSearch = item.name.toLowerCase().includes(searchQuery);
            return matchesCategory && matchesSearch;
        });
        
        let totalQty = items.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('total-items').innerText = items.length;
        document.getElementById('total-quantity').innerText = totalQty;

        if(filteredItems.length === 0) {
            listEl.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px; background:white; border-radius:12px;">Aramanıza uygun malzeme bulunamadı.</p>';
            return;
        }

        filteredItems.forEach(item => {
            const card = document.createElement('div');
            const isCritical = item.quantity <= 1;
            card.className = `item-card ${isCritical ? 'critical' : ''}`;
            const badgeClass = item.category === 'Köşe' ? 'badge-kose' : 'badge-duz';
            
            card.innerHTML = `
                <div class="item-header">
                    <div>
                        <span class="item-title">${item.name}</span>
                        ${isCritical ? '<span class="badge badge-critical">KRİTİK (≤1)</span>' : ''}
                    </div>
                    <span class="badge ${badgeClass}">${item.category}</span>
                </div>
                <div class="item-body">
                    <span style="color:#475569;">Mevcut Stok:</span>
                    <span style="font-size:20px; ${isCritical ? 'color:#dc2626;' : 'color:#0f172a;'}">${item.quantity} Adet</span>
                </div>
                <div class="item-actions">
                    <button class="btn btn-use" onclick="requestAction('use', ${item.id})" ${item.quantity <= 0 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>🟢 Kullan (-1)</button>
                    <button class="btn btn-add" onclick="requestAction('add', ${item.id})">➕ Ekle</button>
                    <button class="btn btn-delete" onclick="requestAction('delete', ${item.id})">🗑️</button>
                </div>
            `;
            listEl.appendChild(card);
        });
    }

    // Kullanım Geçmişini Ekrana Çiz
    function renderLogs() {
        const historyEl = document.getElementById('history-list');
        historyEl.innerHTML = '';

        if(usageLogs.length === 0) {
            historyEl.innerHTML = '<p style="text-align:center; color:#64748b; font-size:13px; padding:10px;">Henüz kullanım kaydı bulunmuyor.</p>';
            return;
        }

        usageLogs.slice().reverse().forEach((log) => {
            const logItem = document.createElement('div');
            logItem.className = 'history-item';
            logItem.innerHTML = `
                <div class="history-info">
                    <strong>${log.name}</strong> (${log.category})
                    <div class="history-date">${log.date}</div>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span style="font-weight:bold; color:#16a34a;">-1 Adet</span>
                    <button class="btn-log-delete no-print" onclick="requestAction('delete_log', ${log.id})" title="Kaydı Sil">🗑️</button>
                </div>
            `;
            historyEl.appendChild(logItem);
        });
    }

    // Yeni Malzeme Ekleme
    function addItem() {
        const nameInput = document.getElementById('item-name');
        const qtyInput = document.getElementById('item-qty');
        const categoryInput = document.getElementById('item-category');

        const name = nameInput.value.trim();
        const qty = parseInt(qtyInput.value);
        const category = categoryInput.value;

        if(!name) {
            alert('Lütfen geçerli bir malzeme adı giriniz.');
            return;
        }
        if(isNaN(qty) || qty < 0) {
            alert('Lütfen geçerli bir stok adedi giriniz.');
            return;
        }

        // Aynı isimde malzeme var mı kontrol et
        const existingItem = items.find(i => i.name.toLowerCase() === name.toLowerCase());
        if(existingItem) {
            existingItem.quantity += qty;
        } else {
            items.push({ id: Date.now(), name, quantity: qty, category });
        }

        nameInput.value = '';
        qtyInput.value = '';
        saveAndRender();
    }

    // Modal Onay Penceresi Tetikleyici
    function requestAction(actionType, id = null) {
        let msg = "";
        let item = null;

        if(id && actionType !== 'delete_log') {
            item = items.find(i => i.id === id);
        }

        if(actionType === 'use' && item) msg = `"${item.name}" malzemesinden 1 adet düşülecek. Onaylıyor musunuz?`;
        if(actionType === 'add' && item) msg = `"${item.name}" malzemesine 1 adet eklenecek. Onaylıyor musunuz?`;
        if(actionType === 'delete' && item) msg = `"${item.name}" malzemesini listeden tamamen silmek istediğinize emin misiniz?`;
        if(actionType === 'delete_log') msg = `Bu kullanım kaydını silmek istediğinize emin misiniz?`;
        if(actionType === 'clear_logs') msg = `Tüm kullanım geçmişini temizlemek istediğinize emin misiniz?`;

        document.getElementById('modal-msg').innerText = msg;
        document.getElementById('confirm-modal').style.display = 'flex';

        document.getElementById('modal-confirm-btn').onclick = function() {
            if(actionType === 'use' && item && item.quantity > 0) {
                item.quantity--;
                const now = new Date();
                const timeString = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
                usageLogs.push({ id: Date.now(), name: item.name, category: item.category, date: timeString });
            }
            if(actionType === 'add' && item) item.quantity++;
            if(actionType === 'delete' && item) items = items.filter(i => i.id !== id);
            if(actionType === 'delete_log') usageLogs = usageLogs.filter(l => l.id !== id);
            if(actionType === 'clear_logs') usageLogs = [];
            
            closeModal();
            saveAndRender();
        };
    }

    function closeModal() {
        document.getElementById('confirm-modal').style.display = 'none';
    }

    // Kategori Filtreleme
    function filterItems(category, btn) {
        currentFilter = category;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
    }

    // Temiz ve Profesyonel PDF Oluşturucu
    function generatePDF() {
        const body = document.body;
        body.classList.add('pdf-mode'); // Butonları ve gereksiz alanları gizle

        const element = document.getElementById('pdf-content');
        const opt = {
            margin:       10,
            filename:     `Santiye_Stok_Raporu_${new Date().toLocaleDateString('tr-TR')}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            body.classList.remove('pdf-mode'); // PDF oluştuktan sonra görünümü eski haline getir
        }).catch(() => {
            body.classList.remove('pdf-mode');
        });
    }

    // Sayfa Açılışında Verileri Yükle
    saveAndRender();
</script>
</body>
</html>
